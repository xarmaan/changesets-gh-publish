name: Changesets
description: A GitHub action to automate releases with Changesets
runs:
  using: "node24"
  main: "dist/index.js"
inputs:
  github_token:
    description: The GitHub token to use for authentication. Defaults to the GitHub-provided token.
    required: false
    default: ${{ github.token }}
  setup_git_user:
    description: Sets up the git user for commits. Default to `true`
    required: false
    default: true
  user_name:
    description: Sets up the git user name for commits. Defaults to `github-actions[bot]`
    required: false
  user_email:
    description: Sets up the git user email for commits. Defaults to `41898282+github-actions[bot]@users.noreply.github.com`
    required: false
  publish:
    description: The command to use to build and publish packages
    required: false
  version:
    description: The command to update version, edit CHANGELOG, read and delete changesets. Default to `changeset version` if not provided
    required: false
  cwd:
    description: Sets the cwd for the node process. Default to `process.cwd()`
    required: false
  commit:
    description: |
      The commit message. Default to `Version Packages`
    required: false
  title:
    description: The pull request title. Default to `Version Packages`
    required: false
  create_github_releases:
    description: A boolean value to indicate whether to create Github releases after `publish` or not
    required: false
    default: true
  commit_mode:
    description: >
      An enum to specify the commit mode. Use "git-cli" to push changes using the Git CLI,
      or "github-api" to push changes via the GitHub API. When using "github-api",
      all commits and tags are signed using GitHub's GPG key and attributed to the user
      or app who owns the GITHUB_TOKEN.
    required: false
    default: git-cli
  branch:
    description: Sets the branch in which the action will run. Default to `github.ref_name` if not provided
    required: false
  pr_draft:
    description: >
      Controls draft PR behavior. Use "create" to create new version PRs as draft, or "always" to also convert existing version PRs back to draft when updating them.'
    required: false
  external_repository:
    description: Repository where to push tags when publishing on GitHub
    required: false
  external_token:
    description: The GitHub token to use for authentication when using external repository. Defaults to `github_token`
    required: false
  external_user_name:
    description: User name to use when publishing to external repository. Defaults to `user_name`
    required: false
  external_user_email:
    description: User email to use when publishing to external repository. Defaults to `user_email`
    required: false
outputs:
  published:
    description: A boolean value to indicate whether a publishing is happened or not
  published_packages:
    description: >
      A JSON array to present the published packages. The format is `[{"name": "@xx/xx", "version": "1.2.0"}, {"name": "@xx/xy", "version": "0.8.9"}]`
  has_changesets:
    description: A boolean about whether there were changesets. Useful if you want to create your own publishing functionality.
  pull_request_number:
    description: The pull request number that was created or updated
branding:
  icon: "package"
  color: "blue"
